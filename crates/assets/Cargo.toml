[package]
name = "gpui-kit-assets"
description = "Default bundled assets for GPUI Kit."
keywords = ["desktop", "gpui", "shadcn", "ui", "uikit"]
license = "Apache-2.0"
documentation = "https://docs.rs/gpui-kit-assets"
homepage = "https://gpui-kit.com"
repository = "https://github.com/longbridge/gpui-kit"
readme = "README.md"
edition.workspace = true
publish = true
version = "0.9.1"

# Retain Cargo icon-directory metadata for existing build-script consumers.
links = "gpui-kit-default-icons"

[dependencies]
anyhow.workspace = true
gpui = { workspace = true, optional = true }
gpui-fast = { workspace = true, optional = true }
log.workspace = true

[dev-dependencies]
gpui_platform.workspace = true
gpui-fast = { workspace = true, features = ["windows-manifest-provided-by-host"] }
gpui-fast-platform.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rust-embed = { version = "8.7.2", features = ["interpolate-folder-path", "include-exclude"] }

[target.'cfg(target_family = "wasm")'.dependencies]
reqwest = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[features]
# Standard GPUI (`gpui-pre`) is on by default. A consumer that builds on GPUI Fast
# alone turns default features off and selects `gpui-fast`, so standard GPUI isn't
# compiled at all. With both on, Fast is used.
default = ["gpui-pre"]
gpui-pre = ["dep:gpui", "gpui-fast?/windows-manifest-provided-by-host"]
gpui-fast = ["dep:gpui-fast"]
